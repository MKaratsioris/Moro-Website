<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
      }

      video {
        width: 100%;
        height: 100%;
        background: #000000;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video muted playsinline preload="auto"></video>
    <script>
      const video = document.querySelector("video");
      const source = new URLSearchParams(window.location.search).get("src");

      video.addEventListener(
        "loadedmetadata",
        () => {
          const latestSafeFrame = Math.max(0, video.duration - 0.25);
          video.currentTime = Math.min(latestSafeFrame, Math.max(0.25, video.duration * 0.35));
        },
        { once: true }
      );
      video.addEventListener(
        "seeked",
        () => {
          document.documentElement.dataset.ready = "true";
        },
        { once: true }
      );
      video.src = source;
    </script>
  </body>
</html>
